<!-- docs/index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Design System Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../dist/design-system.css" />
  </head>
  <body>
    <h1 class="m-xl">CEMS Design system</h1>
    <div
      class="flex flex-col gap-md p-2xl m-xl bg-color-brand-white rounded-sm border-sm"
    >
      <h2>Buttons</h2>
      <div class="flex flex-row gap-md items-center">
        <p>Small buttons</p>
        <button class="btn btn-primary btn-sm">Primary</button>
        <button class="btn btn-secondary btn-sm">Secondary</button>
        <button class="btn btn-confirmative btn-sm">Confirmative</button>
        <button class="btn btn-destructive btn-sm">Destructive</button>
      </div>
      <div class="flex flex-row gap-md items-center">
        <p>Medium buttons</p>
        <button class="btn btn-primary btn-md">Primary</button>
        <button class="btn btn-secondary btn-md">Secondary</button>
        <button class="btn btn-confirmative btn-md">Confirmative</button>
        <button class="btn btn-destructive btn-md">Destructive</button>
      </div>
      <div class="flex flex-row gap-md items-center">
        <p>Large buttons</p>
        <button class="btn btn-primary btn-lg">Primary</button>
        <button class="btn btn-secondary btn-lg">Secondary</button>
        <button class="btn btn-confirmative btn-lg">Confirmative</button>
        <button class="btn btn-destructive btn-lg">Destructive</button>
      </div>
      <div class="flex flex-row gap-md items-center">
        <p>Disabled buttons</p>
        <button class="btn btn-primary btn-md" disabled>Primary</button>
        <button class="btn btn-secondary btn-md" disabled>Secondary</button>
        <button class="btn btn-confirmative btn-md" disabled>
          Confirmative
        </button>
        <button class="btn btn-destructive btn-md" disabled>Destructive</button>
      </div>
    </div>

    <div
      class="flex flex-col gap-md p-2xl m-xl bg-color-brand-white rounded-sm border-sm"
    >
      <h2>Inputs</h2>
      <div class="flex flex-row gap-md items-center">
        <p>Small input</p>
        <input class="input input-sm" placeholder="Type here..." />
      </div>
      <div class="flex flex-row gap-md items-center">
        <p>Medium input</p>
        <input class="input input-md" placeholder="Type here..." />
      </div>
      <div class="flex flex-row gap-md items-center">
        <p>Error input</p>
        <input class="input input-md error" placeholder="Error..." />
      </div>
      <div class="flex flex-row gap-md items-center">
        <p>Disabled input</p>
        <input class="input input-md" disabled placeholder="Error..." />
      </div>
    </div>

    <div
      class="flex flex-col gap-md p-2xl m-xl bg-color-brand-white rounded-sm border-sm"
    >
      <h2>Dropdown</h2>
      <div class="flex flex-row gap-xl w-full">
        <div class="flex flex-col gap-md">
          <p>Small dropdown</p>
          <form>
            <select class="dropdown-sm">
              <option value="Option 1">
                <span>Option 1</span>
              </option>
              <option value="Option 2">
                <span>Option 2</span>
              </option>
              <option value="Option length">
                <span>Option 3</span>
              </option>
            </select>
          </form>
        </div>
        <div class="flex flex-col gap-md">
          <p>Medium dropdown</p>
          <select class="dropdown-md">
            <option value="Option 1">Option 1</option>
            <option value="Option 2">Option 2</option>
            <option value="Option length">Option 3</option>
          </select>
        </div>
        <div class="flex flex-col gap-md">
          <p>Error dropdown</p>
          <select class="dropdown-md error">
            <option value="Option 1">Option 1</option>
            <option value="Option 2">Option 2</option>
            <option value="Option length">Option 3</option>
          </select>
        </div>
        <div class="flex flex-col gap-md">
          <p>Disabled dropdown</p>
          <select class="dropdown-md" disabled>
            <option value="Option 1">Option 1</option>
            <option value="Option 2">Option 2</option>
            <option value="Option length">Option 3</option>
          </select>
        </div>
      </div>
    </div>

    <div
      class="flex flex-col gap-md p-2xl m-xl bg-color-brand-white rounded-sm border-sm"
    >
      <h2>Sliders</h2>
      <div class="flex flex-row gap-md items-center">
        <p>Slider</p>
        <input type="range" min="1" max="100" value="50" class="slider" />
      </div>
    </div>

    <div
      class="flex flex-col gap-md p-2xl m-xl bg-color-brand-white rounded-sm border-sm"
    >
      <h2>Checkboxes</h2>
      <div class="flex flex-row gap-xs items-center">
        <input type="checkbox" class="checkbox" name="checkbox-1" checked />
        <label for="checkbox-1" class="text-sm">Default checkbox</label>
      </div>

      <div class="flex flex-row gap-xs items-center">
        <input type="checkbox" class="checkbox error" name="checkbox-2" />
        <label for="checkbox-2" class="text-sm">Error checkbox</label>
      </div>

      <div class="flex flex-row gap-xs items-center">
        <input
          type="checkbox"
          class="checkbox"
          name="checkbox-3"
          disabled
          checked
        />
        <label for="checkbox-3" class="text-sm">Disabled checkbox</label>
      </div>
    </div>
  </body>
</html>
